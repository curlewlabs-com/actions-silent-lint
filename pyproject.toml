[build-system]
requires = ["flit_core==4.2.0"]
build-backend = "flit_core.buildapi"

[project]
name = "actions-silent-lint"
version = "0.2.0"
description = "Check that every GitHub Actions workflow_run trigger names a workflow that exists, and that no action manifest holds an expression GitHub refuses to load."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Curlew Labs" }]
# The python3 the current Ubuntu hosted runner image ships; the package's
# __init__ refuses anything older with a message.
requires-python = ">=3.12"
# Nothing from PyPI: the package runs on the standard library, plus git and
# mikefarah's yq on PATH, which list and parse the workflows and actions.
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
actions-silent-lint = "actions_silent_lint.cli:main"

[project.urls]
Repository = "https://github.com/curlewlabs-com/actions-silent-lint"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
