name: actions-silent-lint
description: Fail on any workflow_run trigger naming no workflow, and on any action manifest expression GitHub refuses to load.
author: Curlew Labs
branding:
  icon: bell-off
  color: gray-dark

runs:
  using: composite
  steps:
    - name: Judge workflow_run triggers and action manifests
      shell: sh
      run: '"$GITHUB_ACTION_PATH/action/run.sh"'
